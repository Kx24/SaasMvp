<!-- Contact Form - Servicios Eléctricos -->
{% if not contact_disabled %}
<form method="post"
      action="{% url 'contact_submit' %}" 
      class="space-y-5"
      x-data="{ submitting: false }"
      @submit="submitting = true"
      @pageshow.window="submitting = false">
    
    {% csrf_token %}
    
    <!-- Name & Phone -->
    <div class="grid md:grid-cols-2 gap-4">
        <div>
            <label for="name" class="block text-sm font-medium text-slate-700 mb-2">Nombre *</label>
            <input type="text" name="name" id="name" required placeholder="Tu nombre"
                   class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-100 transition-all outline-none">
        </div>
        <div>
            <label for="phone" class="block text-sm font-medium text-slate-700 mb-2">Teléfono *</label>
            <input type="tel" name="phone" id="phone" required placeholder="+56 9 1234 5678"
                   class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-100 transition-all outline-none">
        </div>
    </div>
    
    <!-- Email -->
    <div>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-2">Email *</label>
        <input type="email" name="email" id="email" required placeholder="tu@email.com"
               class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-100 transition-all outline-none">
    </div>
    
    <!-- Service type -->
    <div>
        <label for="subject" class="block text-sm font-medium text-slate-700 mb-2">Tipo de Servicio</label>
        <select name="subject" id="subject"
                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-100 transition-all outline-none bg-white">
            <option value="">Selecciona un servicio</option>
            <option value="Instalación eléctrica">⚡ Instalación eléctrica</option>
            <option value="Mantención preventiva">🔧 Mantención preventiva</option>
            <option value="Emergencia eléctrica">🚨 Emergencia eléctrica</option>
            <option value="Certificación SEC">📋 Certificación SEC</option>
            <option value="Cotización general">💬 Cotización general</option>
            <option value="Otro">📝 Otro</option>
        </select>
    </div>
    
    <!-- Message -->
    <div>
        <label for="message" class="block text-sm font-medium text-slate-700 mb-2">Describe tu necesidad *</label>
        <textarea name="message" id="message" rows="4" required 
                  placeholder="Cuéntanos qué necesitas: tipo de instalación, problema a resolver, dirección aproximada..."
                  class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-100 transition-all outline-none resize-none"></textarea>
    </div>
    
    <!-- Consentimiento (LEY-01) -->
    <div class="flex items-start gap-3">
        <input type="checkbox" name="accept_privacy" id="accept_privacy" value="on" required
               class="mt-1 h-4 w-4 shrink-0 rounded border-slate-300 text-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
        <label for="accept_privacy" class="text-sm text-slate-600">
            He leído y acepto la <a href="{% url 'privacy_policy' %}" target="_blank" rel="noopener" class="text-primary-a11y underline">política de privacidad</a>
        </label>
    </div>

    <!-- Submit -->
    <button type="submit"
            :disabled="submitting"
            class="w-full px-8 py-4 btn-electric rounded-xl font-bold text-lg inline-flex items-center justify-center gap-2 disabled:opacity-70">
        <span x-show="!submitting" class="inline-flex items-center gap-2">
            <span class="bolt-icon">⚡</span> Enviar Solicitud
        </span>
        <span x-show="submitting" x-cloak class="inline-flex items-center gap-2">
            <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Enviando...
        </span>
    </button>
    
    <p class="text-xs text-slate-500 text-center">
        Responderemos a la brevedad. Para emergencias, llámanos directamente.
    </p>
</form>
{% endif %}

<style>[x-cloak] { display: none !important; }</style>
