{% comment %}templates/dashboard/partials/gallery_upload_area.html{% endcomment %}
<div x-data="{ preview: null }"
     class="border-2 border-dashed border-slate-200 rounded-xl p-6 text-center hover:border-slate-300 transition-colors cursor-pointer"
     @click="$refs.fileInput.click()">

    <template x-if="!preview">
        <div>
            <svg class="w-10 h-10 text-slate-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                      d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <p class="text-sm font-medium text-slate-600">Haz clic para seleccionar</p>
            <p class="text-xs text-slate-400 mt-1">JPG, PNG, WebP — máx. 10 MB</p>
        </div>
    </template>

    <template x-if="preview">
        <div class="relative">
            <img :src="preview" class="w-full h-40 object-cover rounded-lg">
            <button type="button"
                    @click.stop="preview = null; $refs.fileInput.value = ''"
                    class="absolute top-2 right-2 w-7 h-7 bg-white rounded-full shadow flex items-center justify-center text-slate-500 hover:text-red-500 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
    </template>

    <input x-ref="fileInput"
           type="file"
           name="image"
           accept="image/*"
           required
           class="hidden"
           @change="preview = $event.target.files[0] ? URL.createObjectURL($event.target.files[0]) : null">
</div>
