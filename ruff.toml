# Configuración de ruff para el arnés de seguridad (Documentacion/KANBAN_PROYECTO.md §2.2).
#
# Set de reglas deliberadamente conservador: errores reales (pyflakes),
# estilo básico (pycodestyle) e imports ordenados (isort). Se excluyen
# reglas de modernización de tipos (UP), manejo de excepciones (BLE/TRY)
# y demás opinion-based rules: el codebase usa `except Exception` a
# propósito en varios puntos de resiliencia (no fallar el request si un
# email falla) y no tiene anotaciones de tipos sistemáticas. Adoptar esas
# reglas hoy generaría ruido masivo sobre código no tocado, no seguridad.
target-version = "py311"
line-length = 110
exclude = [
    "env",
    "**/migrations/*.py",
    "staticfiles",
    "media",
]

[lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # línea larga: no forzar rewrap de código legacy
]
