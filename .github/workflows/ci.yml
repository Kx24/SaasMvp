name: CI

# push solo en ramas de integración y del agente; el resto de las ramas se
# valida vía pull_request. Sin este filtro, cada push a una rama con PR abierto
# corría la CI dos veces (push + pull_request).
on:
  push:
    branches: [develop, main, 'agent/**']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # Valores ficticios: solo lo necesario para importar config.settings (development).
      # SECRET_KEY es la única variable sin default en base.py. Nunca poner secretos reales.
      DJANGO_ENVIRONMENT: development
      SECRET_KEY: ci-solo-para-pruebas-no-es-un-secreto
      DEBUG: "True"
      BASE_DOMAIN: localhost
      BASE_URL: http://localhost:8000
      MP_SANDBOX: "True"
      # Los tests de checkout exigen que MP_ACCESS_TOKEN exista (CONFIG_ERROR si no);
      # los servicios de MercadoPago se mockean, así que basta un valor ficticio.
      MP_ACCESS_TOKEN: TEST-ci-ficticio
      MP_PUBLIC_KEY: TEST-ci-ficticio
      MP_WEBHOOK_SECRET: ci-ficticio
    steps:
      - uses: actions/checkout@v4

      # Render fija PYTHON_VERSION=3.11.0; la CI usa el último parche de 3.11
      # a propósito (detecta regresiones de parche antes de que lleguen a Render).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Gate (ruff, suite, migraciones, cobertura, bandit)
        run: python scripts/gatekeeper.py --strict

      - name: Gate de aislamiento multi-tenant
        run: python manage.py test apps.tenants.tests_isolation

      - name: Ruff (repo completo)
        run: python -m ruff check apps/ config/

      - name: Instalar pip-audit
        run: pip install pip-audit

      - name: Auditoría de dependencias
        run: python -m pip_audit -r requirements.txt
