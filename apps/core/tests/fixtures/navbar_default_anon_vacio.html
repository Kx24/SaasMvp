
<!-- 
    NAVBAR - Template Default
    ========================
    Navbar responsivo con:
    - Logo + nombre empresa
    - Navegación desktop/mobile
    - Botones de autenticación
    - RRSS (opcional)
-->
<nav class="bg-white/95 backdrop-blur-sm shadow-sm fixed top-0 left-0 right-0 z-50 transition-all duration-300"
     x-data="{ 
         mobileMenuOpen: false,
         scrolled: false 
     }"
     @scroll.window="scrolled = window.scrollY > 20"
     :class="{ 'shadow-md': scrolled }">
    
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center h-16 lg:h-20">
            
            <!-- Logo + Nombre -->
            <a href="/" class="flex items-center gap-3 group">
                
                <!-- Logo placeholder -->
                <div class="h-10 lg:h-12 w-10 lg:w-12 bg-primary rounded-lg flex items-center justify-center">
                    <span class="text-white font-bold text-xl">C</span>
                </div>
                
                
                <span class="text-xl lg:text-2xl font-bold text-gray-900 group-hover:text-primary transition">
                    Cliente X
                </span>
            </a>

            <!-- Desktop Navigation -->
            <div class="hidden lg:flex items-center gap-8">
                <!-- Links principales -->
                <div class="flex items-center gap-6">
                    <a href="/" 
                       class="text-gray-700 hover:text-primary font-medium transition">
                        Inicio
                    </a>
                    <a href="#nosotros" 
                       class="text-gray-700 hover:text-primary font-medium transition">
                        Nosotros
                    </a>
                    <a href="#servicios" 
                       class="text-gray-700 hover:text-primary font-medium transition">
                        Servicios
                    </a>
                    <a href="#contacto" 
                       class="text-gray-700 hover:text-primary font-medium transition">
                        Contacto
                    </a>
                </div>
                
                <!-- RRSS -->
                <div class="flex items-center gap-3 pl-6 border-l border-gray-200">
                    
                    
                    
                </div>

                



                <!-- Autenticación -->
                <div class="flex items-center gap-3 pl-6 border-l border-gray-200">
                    
                        <a href="/auth/login/" 
                           class="px-6 py-2 bg-primary text-white rounded-lg hover:bg-secondary transition font-medium">
                            Iniciar Sesión
                        </a>
                    
                </div>
            </div>

            <!-- Mobile Menu Button -->
            <button @click="mobileMenuOpen = !mobileMenuOpen" 
                    class="lg:hidden p-2 text-gray-700 hover:text-primary transition">
                <svg x-show="!mobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
                <svg x-show="mobileMenuOpen" x-cloak class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Mobile Menu -->
        <div x-show="mobileMenuOpen" 
             x-cloak
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 -translate-y-4"
             x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="opacity-100 translate-y-0"
             x-transition:leave-end="opacity-0 -translate-y-4"
             @click.away="mobileMenuOpen = false"
             class="lg:hidden py-4 border-t border-gray-100">
            
            <div class="flex flex-col gap-4">
                <a href="/" @click="mobileMenuOpen = false"
                   class="text-gray-700 hover:text-primary font-medium py-2">Inicio</a>
                <a href="#nosotros" @click="mobileMenuOpen = false"
                   class="text-gray-700 hover:text-primary font-medium py-2">Nosotros</a>
                <a href="#servicios" @click="mobileMenuOpen = false"
                   class="text-gray-700 hover:text-primary font-medium py-2">Servicios</a>
                <a href="#contacto" @click="mobileMenuOpen = false"
                   class="text-gray-700 hover:text-primary font-medium py-2">Contacto</a>
                
                <!-- RRSS Mobile -->
                <div class="flex items-center gap-4 py-4 border-t border-gray-100">
                    
                    
                    
                </div>
                
                



                <!-- Auth Mobile -->
                <div class="pt-4 border-t border-gray-100 space-y-3">
                    
                        <a href="/auth/login/" @click="mobileMenuOpen = false"
                           class="block w-full px-4 py-3 bg-primary text-white rounded-lg text-center hover:bg-secondary transition">
                            Iniciar Sesión
                        </a>
                    
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Spacer para el navbar fixed -->
<div class="h-16 lg:h-20"></div>
