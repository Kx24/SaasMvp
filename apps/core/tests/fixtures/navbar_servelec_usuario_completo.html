<!-- Navbar Servelec — sistema visual electricidad -->
<style>
    /* ── Base links ─────────────────────────────────────────── */
    .nav-link {
        position: relative;
        color: #475569;
        font-size: 0.875rem;
        font-weight: 500;
        padding: 0.5rem 0.25rem;
        transition: color 0.2s;
        font-family: 'Inter', sans-serif;
        letter-spacing: 0.01em;
    }
    .nav-link::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--color-primary), var(--color-accent));
        border-radius: 2px;
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .nav-link:hover {
        color: var(--color-primary);
    }
    .nav-link:hover::after {
        transform: scaleX(1);
    }

    /* ── CTA principal ──────────────────────────────────────── */
    .nav-cta {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
        color: #fff;
        padding: 0.55rem 1.25rem;
        border-radius: 9999px;
        font-size: 0.875rem;
        font-weight: 600;
        font-family: 'Outfit', sans-serif;
        letter-spacing: 0.02em;
        box-shadow: 0 2px 12px color-mix(in srgb, var(--color-primary) 35%, transparent);
        transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    }
    .nav-cta:hover {
        transform: translateY(-1px);
        box-shadow: 0 5px 18px color-mix(in srgb, var(--color-primary) 40%, transparent);
    }
    .nav-cta:active {
        transform: translateY(0);
    }

    /* ── Separador vertical ─────────────────────────────────── */
    .nav-divider {
        width: 1px;
        height: 1.25rem;
        background: #e2e8f0;
    }

    /* ── Scroll state ───────────────────────────────────────── */
    .nav-scrolled {
        box-shadow: 0 1px 0 #e2e8f0, 0 4px 16px rgba(0,0,0,0.06) !important;
    }

    /* ── Mobile links ───────────────────────────────────────── */
    .mobile-link {
        display: flex;
        align-items: center;
        gap: 0.625rem;
        padding: 0.75rem 0.875rem;
        border-radius: 0.75rem;
        font-weight: 500;
        font-size: 0.9375rem;
        color: #334155;
        transition: background 0.15s, color 0.15s;
    }
    .mobile-link:hover {
        background: color-mix(in srgb, var(--color-primary) 8%, transparent);
        color: var(--color-primary);
    }
    .mobile-link .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--color-primary);
        opacity: 0;
        transition: opacity 0.15s;
        flex-shrink: 0;
    }
    .mobile-link:hover .dot {
        opacity: 1;
    }

    [x-cloak] { display: none !important; }
</style>
